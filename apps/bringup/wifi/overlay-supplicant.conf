# Joining networks with wpa_supplicant, from the hostap module, with its
# cryptography from mbedtls and tf-psa-crypto.
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_CRYPTO_ALT=y
# The default leaves little of it unused
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=8192
# The supplicant receives the key handshake through a packet socket
CONFIG_NET_SOCKETS_PACKET=y
CONFIG_NET_SOCKETS_PACKET_DGRAM=y
CONFIG_NET_ETHERNET_FORWARD_UNRECOGNISED_ETHERTYPE=y
CONFIG_HEAP_MEM_POOL_SIZE=262144
