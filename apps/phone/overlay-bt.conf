# Bluetooth BR/EDR for the phone demo: build with -DEXTRA_CONF_FILE=overlay-bt.conf and
# CONFIG_BT_NOKIA_H4P_FIRMWARE set to the BCM2048 firmware script (see the board docs)
CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_DEVICE_NAME="N900"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=31
# Major class Phone, minor class Smartphone
CONFIG_BT_COD=0x00020C
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=8
# The Bluetooth address is derived from the device ID
CONFIG_HWINFO=y
