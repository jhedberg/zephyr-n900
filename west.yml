manifest:
  remotes:
    - name: nashif
      url-base: https://github.com/nashif

  projects:
    - name: zephyr
      remote: nashif
      # Upstream main plus the core changes the N900 needs
      revision: topic/n900/core
      import:
        name-allowlist:
          - cmsis # Cortex-A core headers
          - lvgl  # the phone demo UI
          # PSA crypto for the Bluetooth host
          - mbedtls
          - tf-psa-crypto
          - tf-psa-crypto-drivers
